name: Deploy Danzeisen site to GitHub Pages

on:
  push:
    branches: [ "claude/danzeisen-shop-website-tsa2ma" ]
    paths: [ "danzeisen-website/**", ".github/workflows/deploy-danzeisen-pages.yml" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site (danzeisen-website)
        uses: actions/upload-pages-artifact@v3
        with:
          path: danzeisen-website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Korrekte MIME-Types – wichtig für ES-Module (scene.js importiert three)
    types {
        text/html                             html htm;
        text/css                              css;
        text/javascript                       js mjs;
        application/json                      json;
        image/svg+xml                         svg svgz;
        image/png                             png;
        image/x-icon                          ico;
        font/woff2                            woff2;
    }
    default_type application/octet-stream;

    # gzip für schnellere Auslieferung (three.module.js ~1.2 MB)
    gzip on;
    gzip_types text/css text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Three.js lange cachen (unveränderlich)
    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
